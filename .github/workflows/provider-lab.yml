name: Provider Lab

on:
  push:
    branches: [main, refactor/auto]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lab.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lab.txt
      - name: Verify lab and complete upstream suite on Linux
        if: runner.os == 'Linux'
        run: python scripts/verify_lab.py --upstream
      - name: Verify lab and upstream compilation on Windows
        if: runner.os == 'Windows'
        run: python scripts/verify_lab.py
